<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Your Cart</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            color: white;
            background: url('https://i.pinimg.com/736x/04/27/e7/0427e72887a0a930e63c15f5fb70f4b6.jpg') no-repeat center center fixed;
            background-size: cover;
        }

        body::before {
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            top: 0;
            left: 0;
            z-index: 0;
        }

        .toolbar {
            position: relative;
            z-index: 10;
            background: rgba(76, 175, 80, 0.9);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .toolbar a {
            color: white;
            margin-left: 15px;
            text-decoration: none;
        }

        .container {
            position: relative;
            z-index: 5;
            max-width: 800px;
            background: rgba(255, 255, 255, 0.15);
            margin: 40px auto;
            padding: 25px;
            border-radius: 15px;
            backdrop-filter: blur(5px);
        }

        .cart-item {
            display: flex;
            background: rgba(0, 0, 0, 0.4);
            padding: 15px;
            border-radius: 10px;
            align-items: center;
            margin-bottom: 15px;
        }

        .cart-item img {
            width: 90px;
            border-radius: 10px;
        }

        .info {
            flex: 1;
            padding-left: 20px;
        }

        .qty {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .qty button {
            background: #4CAF50;
            border: none;
            padding: 5px 12px;
            border-radius: 5px;
            cursor: pointer;
            color: white;
        }

        .remove {
            background: #e53935;
            border: none;
            padding: 8px 12px;
            color: white;
            border-radius: 5px;
            margin-left: 15px;
            cursor: pointer;
        }

        .summary {
            background: rgba(0, 0, 0, 0.5);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin-top: 25px;
        }

        .checkout {
            background: #2196F3;
            padding: 15px 40px;
            border: none;
            border-radius: 10px;
            margin-top: 15px;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        input {
            padding: 8px 12px;
            margin-top: 10px;
            border-radius: 5px;
            border: none;
            width: 200px;
            text-align: center;
        }

        #applyBtn {
            background: #ff9800;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            margin-left: 10px;
        }

        #discountMsg {
            margin-top: 10px;
            min-height: 20px;
            color: yellow;
        }

        /* Mobile responsiveness */
        @media (max-width: 768px) {
            .container {
                width: 95%;
                padding: 15px;
            }

            .cart-item {
                flex-direction: column;
                align-items: flex-start;
                padding: 10px;
            }

            .cart-item img {
                width: 100%;
                max-width: 150px;
                margin-bottom: 10px;
            }

            .info {
                padding-left: 0;
                width: 100%;
            }

            .qty {
                width: 100%;
                justify-content: flex-start;
                gap: 5px;
                margin-top: 5px;
            }

            #memberPhone {
                width: 100%;
                margin-top: 5px;
            }

            #applyBtn {
                width: 100%;
                margin: 5px 0 0 0;
            }

            .summary {
                padding: 15px;
            }

            .checkout {
                width: 100%;
                font-size: 16px;
                padding: 12px;
            }
        }

        /* Smaller phones */
        @media (max-width: 480px) {
            .toolbar {
                flex-direction: column;
                align-items: flex-start;
            }

            .toolbar nav a {
                margin-left: 0;
                margin-top: 5px;
            }
        }
    </style>
</head>

<body>
    <div class="toolbar">
        <div class="logo">Matcha Powder Shop</div>
        <nav>
            <a href="Toolbar.html">Home</a>
            <a href="member_ship.html">Member Ship</a>
            <a href="type_powder.html">Powder Type</a>
            <a href="cart.html">Cart</a>
        </nav>
    </div>

    <div class="container">
        <h2>Your Cart</h2>

        <div id="cartItems"></div>

        <div class="summary">
            <h3>Order Summary</h3>
            <p id="totalItems"></p>
            <p id="totalPrice"></p>

            <div>
                <input type="text" id="memberPhone" placeholder="Enter Phone Number">
                <button id="applyBtn" onclick="applyMemberDiscount()">Apply</button>
                <div id="discountMsg"></div>
            </div>

            <button class="checkout" onclick="checkout()">Checkout</button>
        </div>
    </div>

    <script>
        // Load cart from localStorage
        let cart = JSON.parse(localStorage.getItem("cartArray")) || [];

        let discountApplied = false;

        const imageMap = {
            "Ceremonial Grade": "https://i.pinimg.com/1200x/fd/9d/20/fd9d20d83484fc3d687d07628de8c19a.jpg",
            "Premium Grade": "https://i.pinimg.com/736x/c1/15/78/c11578985830c51a7ffbfd4f527558a9.jpg",
            "Culinary Grade": "https://i.pinimg.com/1200x/a4/8a/dd/a48add6055db4107c97bf0b6d1f6073e.jpg"
        };

        function renderCart() {
            const container = document.getElementById("cartItems");
            if (cart.length === 0) {
                container.innerHTML = "<p>Your cart is empty.</p>";
                document.getElementById("totalItems").innerText = "";
                document.getElementById("totalPrice").innerText = "";
                return;
            }

            container.innerHTML = "";
            cart.forEach((item, index) => {
                const img = imageMap[item.name] || "https://via.placeholder.com/100";
                container.innerHTML += `
                    <div class="cart-item">
                        <img src="${img}" alt="${item.name}">
                        <div class="info">
                            <h3>${item.name}</h3>
                            <p>Price: $${item.price}</p>
                        </div>
                        <div class="qty">
                            <button onclick="changeQty(${index}, -1)">-</button>
                            <span>${item.qty}</span>
                            <button onclick="changeQty(${index}, 1)">+</button>
                        </div>
                        <button class="remove" onclick="removeItem(${index})">Remove</button>
                    </div>
                `;
            });

            updateSummary();
        }

        function changeQty(index, amount) {
            cart[index].qty += amount;
            if (cart[index].qty < 1) cart[index].qty = 1;
            localStorage.setItem("cartArray", JSON.stringify(cart));
            renderCart();
        }

        function removeItem(index) {
            cart.splice(index, 1);
            localStorage.setItem("cartArray", JSON.stringify(cart));
            renderCart();
        }

        function updateSummary() {
            let totalItems = cart.reduce((sum, item) => sum + item.qty, 0);
            let totalPrice = cart.reduce((sum, item) => sum + item.price * item.qty, 0);

            if (discountApplied) totalPrice *= 0.9;

            document.getElementById("totalItems").innerText = "Total Items: " + totalItems;
            document.getElementById("totalPrice").innerText = "Total Price: $" + totalPrice.toFixed(2);
        }

        function applyMemberDiscount() {
            const phone = document.getElementById("memberPhone").value.trim();
            const msg = document.getElementById("discountMsg");

            // Load saved members
            const members = JSON.parse(localStorage.getItem("members")) || [];

            if (members.includes(phone)) {
                discountApplied = true;
                msg.innerText = "10% discount applied!";
            } else {
                discountApplied = false;
                msg.innerText = "Invalid member phone!";
            }

            updateSummary();
        }

        function checkout() {
            if (cart.length === 0) {
                alert("Your cart is empty.");
                return;
            }
            alert("Order placed successfully!");
            cart = [];
            localStorage.setItem("cartArray", JSON.stringify(cart));
            discountApplied = false;
            document.getElementById("memberPhone").value = "";
            document.getElementById("discountMsg").innerText = "";
            renderCart();
        }

        window.onload = renderCart;
    </script>
</body>

</html>
