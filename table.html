<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Table</title>

    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
        }

        .table-box {
            background: rgba(0, 0, 0, 0.4);
            padding: 70px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            backdrop-filter: blur(6px);
            animation: fadeIn 1.4s ease-out;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        table {
            text-align: right;
            width: 800px;
            border-collapse: collapse;
            font-size: 18px;
        }

        table, th, td {
            border: 1px solid rgba(255,255,255,0.3);
        }

        th {
            background: rgba(255,255,255,0.2);
            padding: 12px;
            text-align: left;
        }

        td {
            text-align: center ;
            background: rgba(0,0,0,0.3);
            padding: 12px;
        }

        button.delete-btn {
            background: #e74c3c;
            border: none;
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
        }

        button.delete-btn:hover {
            background: #c0392b;
        }

        @keyframes fadeIn {
            from {
                transform: translateY(-30px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .back-btn {
            margin-top: 20px;
            display: block;
            width: 100%;
            padding: 12px;
            text-align: center;
            background: #30ad17b1;
            border-radius: 10px;
            color: white;
            text-decoration: none;
            font-size: 18px;
            transition: 0.3s;
        }

        .back-btn:hover {
            background: #45a049;
            transform: scale(1.05);
        }
    </style>

</head>

<body>

    <div class="table-box">
        <h2>Saved Student Information</h2>

        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>First Name</th>
                    <th>Last Name</th>
                    <th>Age</th>
                    <th>DOB</th>
                    <th>Sex</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>

        <a href="form.html" class="back-btn">Back to Form</a>
    </div>

    <script>
        let students = JSON.parse(localStorage.getItem("students")) || [];
        const tableBody = document.getElementById("tableBody");

        function renderTable() {
            tableBody.innerHTML = ''; 
            students.forEach((student, index) => {
                let row = document.createElement("tr");
                row.innerHTML = `
                    <td>${index + 1}</td>
                    <td>${student.fname}</td>
                    <td>${student.lname}</td>
                    <td>${student.age}</td>
                    <td>${student.dob}</td>
                    <td>${student.sex}</td>
                    <td><button class="delete-btn" onclick="deleteStudent(${index})">Delete</button></td>
                `;
                tableBody.appendChild(row);
            });
        }

        function deleteStudent(index) {
            if(confirm("Are you sure you want to delete this student?")) {
                students.splice(index, 1); // Remove from array
                localStorage.setItem("students", JSON.stringify(students)); // Update storage
                renderTable(); // Re-render table
            }
        }

        renderTable(); // Initial render
    </script>

</body>
</html>
